services:
  db:
    image: mysql:8.0
    container_name: replay-games-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env de la raíz}
      MYSQL_DATABASE: ${DB_NAME:-replay_games}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/replay_games.sql:/docker-entrypoint-initdb.d/01-replay_games.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - replay_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: replay-games-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env de la raíz}
      DB_NAME: ${DB_NAME:-replay_games}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 caracteres) en el archivo .env de la raíz}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      AUTH_MAX_INTENTOS: ${AUTH_MAX_INTENTOS:-20}
      API_MAX_PETICIONES: ${API_MAX_PETICIONES:-200}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      RAWG_API_URL: ${RAWG_API_URL:-https://api.rawg.io/api}
      RAWG_TIMEOUT_MS: ${RAWG_TIMEOUT_MS:-5000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/salud').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - replay_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: replay-games-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - replay_net

volumes:
  mysql_data:

networks:
  replay_net:
    driver: bridge
