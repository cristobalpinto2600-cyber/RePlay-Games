server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión de recursos estáticos (EF2).
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Cabeceras de seguridad básicas para archivos servidos por Nginx.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Los bundles con hash generados por Vite pueden cachearse de forma prolongada.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Permite recargar cualquier ruta de React Router / Ionic directamente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
